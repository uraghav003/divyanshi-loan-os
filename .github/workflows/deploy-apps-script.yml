name: Deploy to Google Apps Script (Jankpuri)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Authenticate clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "❌ CLASPRC_JSON secret is not set."
            echo "   Run 'clasp login' locally, then copy ~/.clasprc.json contents as the secret."
            exit 1
          fi
          echo "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Push to Apps Script
        run: clasp push --force

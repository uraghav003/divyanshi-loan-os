name: Deploy to Google Apps Script (Jankpuri)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v6

      - name: Check deployment authorization
        id: authorization
        run: |
          if [ -z "$GOOGLE_CREDENTIALS" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deployment skipped: GOOGLE_CREDENTIALS is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.authorization.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install clasp
        if: steps.authorization.outputs.configured == 'true'
        run: npm install -g @google/clasp

      - name: Build clasp credentials
        if: steps.authorization.outputs.configured == 'true'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const os = require('os');
          let credentials;
          try { credentials = JSON.parse(process.env.GOOGLE_CREDENTIALS || ''); }
          catch (_) { throw new Error('GOOGLE_CREDENTIALS must contain valid JSON.'); }
          for (const field of ['client_id', 'client_secret', 'refresh_token']) {
            if (!credentials[field]) throw new Error(`GOOGLE_CREDENTIALS is missing ${field}.`);
          }
          const clasp = {
            token: {
              access_token: '',
              refresh_token: credentials.refresh_token,
              scope: 'https://www.googleapis.com/auth/script.deployments https://www.googleapis.com/auth/script.projects https://www.googleapis.com/auth/script.webapp.deploy https://www.googleapis.com/auth/drive.metadata.readonly https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/service.management',
              token_type: 'Bearer',
              expiry_date: 1
            },
            oauth2ClientSettings: {
              clientId: credentials.client_id,
              clientSecret: credentials.client_secret,
              redirectUri: 'http://localhost'
            },
            isLocalCreds: false
          };
          fs.writeFileSync(`${os.homedir()}/.clasprc.json`, JSON.stringify(clasp));
          console.log('Clasp credentials configured.');
          NODE

      - name: Push to Apps Script
        if: steps.authorization.outputs.configured == 'true'
        run: clasp push --force

<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Divyanshi Capital | India's Largest Loan Facilitator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'DM Sans',sans-serif}
    h1,h2,h3,.display{font-family:'Playfair Display',serif}
    :root{
      --navy:#0B1F3A;--navy2:#142d54;--gold:#C9A84C;--gold2:#e8c56a;--gold-dim:#8a6f2e;
      --orange:#F97316;--bg:#f5f3ee;--white:#fff;--text:#1a1a2e;--muted:#6b7280;
      --green:#059669;--red:#dc2626;--line:#e5e0d5;--card-shadow:0 8px 32px rgba(11,31,58,0.08);
    }
    body{background:var(--bg);color:var(--text);overflow-x:hidden}
    a{text-decoration:none;color:inherit}
    input,select,textarea,button{font-family:'DM Sans',sans-serif}
    .topbar{background:var(--navy);color:rgba(255,255,255,0.8);padding:8px 5%;display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px;flex-wrap:wrap}
    .ticker-wrap{flex:1;overflow:hidden;white-space:nowrap;background:rgba(255,255,255,0.05);border-radius:4px;padding:3px 10px;margin:0 12px}
    .ticker{display:inline-block;animation:ticker 35s linear infinite;font-size:11px;font-weight:600;color:var(--gold2);letter-spacing:0.5px;text-transform:uppercase}
    @keyframes ticker{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
    .header{background:rgba(255,255,255,0.96);backdrop-filter:blur(16px);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line);box-shadow:0 2px 20px rgba(0,0,0,0.04)}
    .logo-wrap{display:flex;align-items:center;gap:12px}
    .logo-img{height:42px;width:auto}
    .logo-text{display:flex;flex-direction:column;line-height:1.1}
    .logo-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:var(--navy)}
    .logo-tag{font-size:8px;font-weight:700;color:var(--orange);letter-spacing:1px;text-transform:uppercase}
    .nav{display:flex;gap:28px;align-items:center}
    .nav a{font-size:13px;font-weight:600;color:var(--text);transition:color 0.2s}
    .nav a:hover{color:var(--gold)}
    .btn{background:var(--gold);color:#000;border:0;border-radius:8px;padding:11px 22px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.25s;letter-spacing:0.2px;text-decoration:none}
    .btn:hover{background:var(--gold2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(201,168,76,0.35)}
    .btn:disabled{opacity:0.5;pointer-events:none}
    .btn-orange{background:var(--orange);color:#fff}
    .btn-orange:hover{background:#ea580c;box-shadow:0 6px 20px rgba(249,115,22,0.35)}
    .staff-bar{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:10px 5%;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}
    .dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 2s infinite;flex-shrink:0}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}}
    .hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,#1a4a7a 100%);color:#fff;padding:70px 5% 60px;position:relative;overflow:hidden}
    .hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23C9A84C' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E")}
    .hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr 0.9fr;gap:60px;align-items:center;max-width:1200px;margin:0 auto}
    .hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);border-radius:100px;padding:6px 16px;font-size:12px;font-weight:700;color:var(--gold2);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:20px}
    .hero h1{font-size:46px;line-height:1.12;margin-bottom:18px;font-weight:900}
    .hero h1 span{color:var(--gold)}
    .hero p{font-size:16px;line-height:1.75;color:rgba(255,255,255,0.75);margin-bottom:30px;font-weight:300}
    .hero-btns{display:flex;gap:14px;flex-wrap:wrap}
    .hero-stats{display:flex;gap:24px;margin-top:36px;flex-wrap:wrap}
    .stat-num{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--gold)}
    .stat-lbl{font-size:11px;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
    /* Employee Card */
    .emp-card{background:rgba(255,255,255,0.06);border:1px solid rgba(201,168,76,0.25);backdrop-filter:blur(12px);border-radius:20px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,0.25)}
    .emp-avatar-wrap{position:relative;width:90px;height:90px;margin:0 auto 16px}
    .emp-avatar{width:90px;height:90px;border-radius:50%;border:3px solid var(--gold);object-fit:cover;display:block}
    .emp-online{position:absolute;bottom:3px;right:3px;width:18px;height:18px;background:var(--green);border:2.5px solid #142d54;border-radius:50%}
    .emp-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#fff;text-align:center;margin-bottom:4px}
    .emp-role{font-size:12px;color:rgba(255,255,255,0.6);text-align:center;margin-bottom:16px;letter-spacing:0.3px;text-transform:uppercase}
    .emp-actions{display:flex;flex-direction:column;gap:10px}
    .eab{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;border:1px solid transparent;width:100%;text-decoration:none;justify-content:flex-start}
    .eab-wa{background:rgba(37,211,102,0.12);color:#25d366;border-color:rgba(37,211,102,0.25)}
    .eab-wa:hover{background:#25d366;color:#fff}
    .eab-tg{background:rgba(0,136,204,0.12);color:#29a9e0;border-color:rgba(0,136,204,0.25)}
    .eab-tg:hover{background:#0088cc;color:#fff}
    .eab-call{background:rgba(201,168,76,0.12);color:var(--gold2);border-color:rgba(201,168,76,0.25)}
    .eab-call:hover{background:var(--gold);color:#000}
    .eab-apply{background:var(--gold);color:#000}
    .eab-apply:hover{background:var(--gold2)}
    /* Partners */
    .partners{background:var(--navy);padding:20px 5%;overflow:hidden}
    .ptrack{display:flex;gap:40px;align-items:center;animation:pscroll 35s linear infinite;white-space:nowrap}
    .ptrack img{height:26px;opacity:0.5;filter:brightness(0) invert(1);transition:opacity 0.2s;flex-shrink:0}
    .ptrack img:hover{opacity:1}
    @keyframes pscroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    /* Sections */
    .section{padding:72px 5%;max-width:1400px;margin:0 auto}
    .sfull{padding:72px 5%}
    .slabel{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
    .stitle{font-size:36px;font-weight:900;color:var(--navy);margin-bottom:8px;line-height:1.15}
    .ssub{font-size:15px;color:var(--muted);margin-bottom:40px;line-height:1.6}
    .loan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
    .loan-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 20px;cursor:pointer;transition:all 0.3s;text-align:center;position:relative;overflow:hidden}
    .loan-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));transform:scaleX(0);transform-origin:left;transition:transform 0.3s}
    .loan-card:hover{transform:translateY(-5px);box-shadow:0 20px 40px rgba(11,31,58,0.1);border-color:var(--gold)}
    .loan-card:hover::before{transform:scaleX(1)}
    .loan-icon{font-size:38px;margin-bottom:14px;display:block}
    .loan-card h3{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:8px}
    .loan-card p{font-size:12px;color:var(--muted)}
    .loan-tag{display:inline-block;background:rgba(201,168,76,0.12);color:var(--gold-dim);font-size:10px;font-weight:700;padding:3px 10px;border-radius:100px;margin-top:10px}
    /* Calc */
    .calc-section{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:72px 5%}
    .calc-wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
    .calc-box{background:#fff;border-radius:20px;padding:36px;box-shadow:var(--card-shadow)}
    .flabel{font-size:12px;font-weight:700;color:var(--navy);margin:14px 0 4px;letter-spacing:0.3px;text-transform:uppercase}
    .field{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-weight:500;color:var(--text);background:#fafaf8;transition:all 0.2s}
    .field:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.12);outline:none;background:#fff}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .rbox{background:var(--navy);color:#fff;border-radius:14px;padding:22px;margin-top:20px;display:none;animation:fadeUp 0.3s ease}
    .remi{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:var(--gold)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .calc-info h2{font-size:36px;color:#fff;margin-bottom:16px}
    .calc-info p{color:rgba(255,255,255,0.7);font-size:15px;line-height:1.7;margin-bottom:24px}
    .cfeat{display:flex;align-items:center;gap:12px;margin:12px 0;color:rgba(255,255,255,0.85);font-size:14px;font-weight:500}
    .cfeat .ci{width:34px;height:34px;background:rgba(201,168,76,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    /* Why */
    .why-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
    .wcard{border:1px solid var(--line);border-radius:16px;padding:28px;transition:all 0.3s;background:#fafaf8}
    .wcard:hover{border-color:var(--gold);box-shadow:var(--card-shadow);background:#fff}
    .wicon{width:48px;height:48px;background:rgba(201,168,76,0.1);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px}
    .wcard h3{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:8px}
    .wcard p{font-size:13px;color:var(--muted);line-height:1.6}
    /* Form */
    .form-wrap{background:var(--bg);min-height:100vh;padding:56px 5%}
    .form-box{max-width:600px;margin:0 auto;background:#fff;border-radius:20px;padding:40px;box-shadow:var(--card-shadow);border:1px solid var(--line)}
    .staff-mini{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(11,31,58,0.04),rgba(201,168,76,0.06));border:1px solid rgba(201,168,76,0.2);border-radius:14px;padding:14px 18px;margin-bottom:24px}
    .staff-mini img{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
    .bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
    .bchip{border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s;display:flex;align-items:center;gap:8px;background:#fafaf8}
    .bchip input{width:14px;height:14px;cursor:pointer;flex-shrink:0;margin:0}
    .bchip.selected{border-color:var(--gold);background:rgba(201,168,76,0.07);color:var(--navy)}
    .msg{text-align:center;margin-top:14px;font-size:13px;font-weight:600;min-height:20px}
    .ok{color:var(--green)}.err{color:var(--red)}
    /* Dashboard */
    .dashboard{background:#0a1628;color:#fff;min-height:100vh;padding:28px}
    .dhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.06)}
    .dhead h1{font-size:26px;color:var(--gold);font-weight:900}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-bottom:24px}
    .kc{background:#111d35;border:1px solid rgba(201,168,76,0.12);border-radius:16px;padding:22px;transition:transform 0.2s}
    .kc:hover{transform:translateY(-2px)}
    .kval{font-size:32px;font-weight:900;color:var(--gold);font-family:'Playfair Display',serif}
    .klbl{font-size:11px;color:rgba(255,255,255,0.5);margin-top:6px;text-transform:uppercase;letter-spacing:0.5px}
    .tbox{background:#111d35;border-radius:16px;padding:22px;overflow-x:auto;border:1px solid rgba(255,255,255,0.04)}
    table{width:100%;border-collapse:collapse}
    th{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;padding:14px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.06)}
    td{padding:14px 12px;font-size:13px;font-weight:500;border-bottom:1px solid rgba(255,255,255,0.04);white-space:nowrap;color:rgba(255,255,255,0.85)}
    /* Card */
    .card-page{background:radial-gradient(ellipse at top,#142d54,#0a1628);min-height:100vh;padding:40px 20px;display:flex;align-items:center;justify-content:center}
    .bcard{width:400px;max-width:100%;border:1px solid rgba(201,168,76,0.2);border-radius:24px;padding:36px 28px;text-align:center;color:#fff;background:rgba(255,255,255,0.03);backdrop-filter:blur(16px);box-shadow:0 30px 80px rgba(0,0,0,0.4)}
    .bav-wrap{position:relative;width:100px;height:100px;margin:0 auto 6px}
    .bav{width:100px;height:100px;border-radius:50%;border:3px solid var(--gold);object-fit:cover}
    .bonline{position:absolute;bottom:4px;right:4px;width:20px;height:20px;background:var(--green);border:3px solid #0a1628;border-radius:50%;animation:pulse 2s infinite}
    .bname{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:#fff;margin-bottom:4px}
    .brole{font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:4px;letter-spacing:0.5px;text-transform:uppercase}
    .bco{font-size:13px;color:var(--gold);font-weight:700;margin-bottom:22px}
    .blinks{display:flex;flex-direction:column;gap:10px}
    .blink{display:flex;align-items:center;gap:12px;padding:13px 18px;border-radius:12px;font-size:13px;font-weight:700;transition:all 0.2s;border:1px solid rgba(255,255,255,0.08);color:#fff;background:rgba(255,255,255,0.04)}
    .blink:hover{border-color:var(--gold);background:rgba(201,168,76,0.1);color:var(--gold);transform:translateX(4px)}
    .blink.primary{background:var(--gold);color:#000;border-color:var(--gold)}
    .blink.primary:hover{background:var(--gold2)}
    .blink .bi{width:28px;text-align:center;font-size:16px;flex-shrink:0}
    /* Chat */
    .cfab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:24px;z-index:200;cursor:pointer;box-shadow:0 8px 24px rgba(201,168,76,0.4);transition:all 0.3s;border:0}
    .cfab:hover{transform:scale(1.1)}
    .cbox{display:none;position:fixed;right:22px;bottom:92px;width:360px;max-width:calc(100vw - 28px);height:500px;background:#fff;border-radius:20px;z-index:199;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.15);border:1px solid var(--line);animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1)}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
    .chead{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
    .chead-info{display:flex;align-items:center;gap:10px}
    .chead-av{width:36px;height:36px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px}
    .cbody{height:356px;overflow-y:auto;padding:16px;background:#f8f7f4;display:flex;flex-direction:column;gap:10px}
    .bubble{padding:11px 15px;border-radius:14px;font-size:13px;line-height:1.55;max-width:82%;word-break:break-word}
    .bot-b{background:#fff;color:var(--text);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
    .user-b{background:var(--navy);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
    .cinp{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:#fff}
    .cinp input{flex:1;padding:10px 14px;border:1.5px solid var(--line);border-radius:100px;font-size:13px;background:#f8f7f4;outline:none;transition:border-color 0.2s}
    .cinp input:focus{border-color:var(--gold)}
    .csend{width:38px;height:38px;border-radius:50%;background:var(--gold);border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all 0.2s;flex-shrink:0}
    .csend:hover{background:var(--gold2)}
    /* TY */
    .ty-circle{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--green),#047857);display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 10px 30px rgba(5,150,105,0.3);animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both}
    @keyframes popIn{0%{transform:scale(0)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
    .crow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--text);opacity:0;animation:fadeUp 0.4s ease forwards}
    .crow:nth-child(1){animation-delay:0.3s}.crow:nth-child(2){animation-delay:0.45s}.crow:nth-child(3){animation-delay:0.6s}.crow:nth-child(4){animation-delay:0.75s}.crow:nth-child(5){animation-delay:0.9s}
    /* Footer */
    .footer{background:var(--navy);color:rgba(255,255,255,0.7);padding:56px 5% 32px}
    .fg{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:40px;margin-bottom:40px}
    .fc h4{font-size:13px;font-weight:700;color:#fff;margin-bottom:14px;text-transform:uppercase;letter-spacing:0.5px}
    .fc a{display:block;font-size:13px;color:rgba(255,255,255,0.55);margin-bottom:8px;transition:color 0.2s}
    .fc a:hover{color:var(--gold)}
    .fbot{border-top:1px solid rgba(255,255,255,0.08);padding-top:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:12px}
    .fsoc{display:flex;gap:14px}
    .fsoc a{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.2s}
    .fsoc a:hover{background:var(--gold);color:#000}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:900px){.hero-inner{grid-template-columns:1fr;gap:32px}.hero h1{font-size:32px}.calc-wrap{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}.nav{display:none}.header>.btn{display:none}}
    @media(max-width:480px){.hero{padding:44px 5% 36px}.section{padding:48px 5%}.form-box{padding:24px 18px}.fg{grid-template-columns:1fr}.bcard{padding:28px 20px}}
  </style>
</head>

  <script id="BOOT_DATA" type="application/json">__P1_BOOT_DATA_JSON__</script>
  <div id="app"><h1 style="color:red;padding:50px">LOADING... IF THIS STAYS, JAVASCRIPT CRASHED.</h1></div>

      <div class="chead-info">
        <div class="chead-av">🤖</div>
        <div><div style="font-weight:700;font-size:14px">Bulbhul AI Banker</div><div style="font-size:11px;color:var(--green);font-weight:600">● Online</div></div>

function renderDashboard(){
  var d=DASH||{ok:true,staff:{NAME:'Team'},stats:{total:0,approved:0,review:0,volume:0},cases:[],access:'STAFF'};

  var camp=['MD','FOUNDER','ADMIN','MANAGER'].indexOf(String(d.access||'').toUpperCase())>-1?'<div class="tbox" style="margin-top:20px"><h3 style="color:var(--gold);margin-bottom:14px;font-size:16px">📢 Telegram Campaign</h3><textarea class="field" id="cmp" rows="3" placeholder="Campaign message..." style="background:#0a1628;color:#fff;border-color:rgba(255,255,255,0.1)"></textarea><button class="btn" id="cb" onclick="sendCamp()" style="margin-top:10px">Send to All ✦</button></div>':'';
  $app('<div class="dashboard"><div class="dhead"><div><h1>Welcome, '+safe((d.staff&&d.staff.NAME)||'Team')+' 👋</h1><p style="color:rgba(255,255,255,0.5);font-size:13px">'+safe((d.staff&&d.staff.DESIGNATION)||'')+' · '+safe((d.staff&&d.staff.DEPARTMENT)||'')+'</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="'+ru('card')+'" style="font-size:12px;padding:9px 16px">💼 My Card</a><a class="btn" href="'+ru('home')+'" style="font-size:12px;padding:9px 16px;background:rgba(255,255,255,0.08);color:#fff">← Home</a></div></div><div class="kpi-grid"><div class="kc"><div class="kval">'+(d.stats&&d.stats.total||0)+'</div><div class="klbl">Total Leads</div></div><div class="kc"><div class="kval">'+(d.stats&&d.stats.approved||0)+'</div><div class="klbl">Approved</div></div><div class="kc" style="border-color:rgba(249,115,22,0.2)"><div class="kval" style="color:var(--orange)">'+(d.stats&&d.stats.review||0)+'</div><div class="klbl">Pending Follow-up</div></div><div class="kc"><div class="kval">₹'+(((d.stats&&d.stats.volume)||0)/100000).toFixed(1)+'L</div><div class="klbl">Total Volume</div></div></div><div class="tbox"><h3 style="color:var(--gold);margin-bottom:16px;font-size:16px">Recent Cases</h3><table><thead><tr><th>Lead ID</th><th>Client</th><th>Mobile</th><th>Loan</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+camp+'</div>');
}
function renderCalling(){
  var url=hasGAS()?ru('calling'):'/DC_CALLING_APP.html'+(EMP?'?emp='+EMP_ENC:'');
  $app(hdr()+'<div style="width:100%;height:calc(100vh - 120px);background:#060f1e;overflow:hidden"><iframe src="'+url+'" style="width:100%;height:100%;border:none" allow="camera;microphone;clipboard-read;clipboard-write"></iframe></div>');
}
function renderVoice(){
  var url=hasGAS()?ru('voice'):'/voice.html'+(EMP?'?emp='+EMP_ENC:'');
  $app(hdr()+'<div style="width:100%;height:calc(100vh - 120px);background:#060f1e;overflow:hidden"><iframe src="'+url+'" style="width:100%;height:100%;border:none" allow="camera;microphone;clipboard-read;clipboard-write"></iframe></div>');
}
function calcEMI(){
  var code=document.getElementById('clt').value;
  var inc=Number(document.getElementById('cin').value);
  var amt=Number(document.getElementById('cam').value);
  var yrs=Number(document.getElementById('cten').value);
  if(!inc||!amt||!yrs){alert('Sab fields fill karein');return;}
  var prod=PRODUCTS.find(function(p){return p.code===code;})||PRODUCTS[0];
  var r=(prod.roi||10.5)/12/100,n=yrs*12;
  var emi=Math.round(amt*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1));
  var ok=emi<=inc*0.5&&amt<=inc*60;
  var why=emi>inc*0.5?'EMI exceeds 50% FOIR. Lower amount ya higher income needed.':amt>inc*60?'Loan amount too high vs income multiplier.':'';
  var rbox=document.getElementById('rbox');rbox.style.display='block';
  document.getElementById('remi').textContent='EMI: ₹'+money(emi)+' / month';
  var rm=document.getElementById('rmsg');
  rm.textContent=ok?'✅ Pre-eligible! Apply karo — fast process.':'⚠ '+why;
  rm.style.color=ok?'#10b981':'#f97316';
  callGAS('MLA_LOG_ACTIVITY',{type:'EMI_CALC',empCode:EMP,amount:amt}).catch(function(){});
}
function loadBanks(){
  var sel=document.querySelector('select[name="loan_type"]');
  var val=sel?sel.value:'';
  var sec=document.getElementById('bsec');var grid=document.getElementById('bgrid');
  if(!sec||!grid)return;
  var key=Object.keys(BMAP).find(function(k){return val.toUpperCase().includes(k.split(' ')[0].toUpperCase());})||'';
  var banks=BMAP[key]||[];
  if(!banks.length){sec.style.display='none';return;}
  sec.style.display='block';
  grid.innerHTML=banks.map(function(b){return '<div class="bchip" onclick="toggleB(this,\''+safe(b)+'\')"><input type="checkbox" value="'+safe(b)+'" onclick="event.stopPropagation();syncB()">'+safe(b)+'</div>';}).join('');
  document.getElementById('pb').value='';
}
function toggleB(chip,name){var c=chip.querySelector('input');c.checked=!c.checked;chip.classList.toggle('selected',c.checked);syncB();}
function syncB(){document.getElementById('pb').value=Array.from(document.querySelectorAll('.bchip input:checked')).map(function(c){return c.value;}).join(',');}
function copyLink(){
  var url=ru('form');
  if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){var m=document.getElementById('cpyMsg');if(m)m.textContent='✅ Link copied! Share karein now';}).catch(function(){});}
}
function sendCamp(){
  var msg=document.getElementById('cmp')&&document.getElementById('cmp').value.trim();
  if(!msg){alert('Message enter karein');return;}
  var btn=document.getElementById('cb');btn.disabled=true;
  callGAS('DC_TG_BROADCAST',msg).then(function(r){btn.disabled=false;alert(r||'Broadcast sent!');document.getElementById('cmp').value='';}).catch(function(e){btn.disabled=false;alert('Failed: '+(e.message||e));});
}
var chatOpen=false;
function toggleChat(){
  chatOpen=!chatOpen;
  var box=document.getElementById('cbox');
  box.style.display=chatOpen?'flex':'none';
  if(chatOpen){box.style.flexDirection='column';document.getElementById('ci').focus();}
}
function sendChat(){
  var inp=document.getElementById('ci');var txt=inp.value.trim();if(!txt)return;
  var body=document.getElementById('cbody');
  body.innerHTML+='<div class="bubble user-b">'+safe(txt)+'</div>';
  inp.value='';body.scrollTop=body.scrollHeight;
  callGAS('BULBHUL_CHAT_API',{message:txt,empCode:EMP,source:'INDEX'}).then(function(res){
    var reply=typeof res==='string'?res:(res&&(res.reply||res.text||res.message)||'Ji, bataiye?');
    body.innerHTML+='<div class="bubble bot-b">'+safe(reply)+'</div>';
    body.scrollTop=body.scrollHeight;
  }).catch(function(err){body.innerHTML+='<div class="bubble bot-b">Offline: '+safe(err.message||String(err))+'</div>';body.scrollTop=body.scrollHeight;});
}
function renderApp(){
  try{
    if(!document.getElementById('app'))return;
    if((!BOOT.staff||!BOOT.staff.ok)&&EMP&&EMP!=='EMP_CODE'){
      document.getElementById('app').innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;color:var(--navy)"><div style="width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px"></div><strong>'+EMP+' profile sync ho raha hai...</strong></div>';
      callGAS('get_boot_data',{empCode:EMP,page:PAGE}).then(function(res){if(res){BOOT=res;if(res.staff)STAFF=res.staff;if(res.dashboard)DASH=res.dashboard;}renderPage();}).catch(function(){renderPage();});
    }else renderPage();
  }catch(e){document.getElementById('app').innerHTML='<div style="padding:40px"><h2 style="color:red">Error</h2><p>'+safe(e.message)+'</p></div>';}
}
function renderPage(){
  if(PAGE==='form'||PAGE==='smart')renderForm();
  else if(PAGE==='dashboard')renderDashboard();
  else if(PAGE==='card')renderCard();
  else if(PAGE==='calling')renderCalling();
  else if(PAGE==='voice')renderVoice();
  else renderHome();
}
renderApp();
</script>
